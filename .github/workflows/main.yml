name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          mkdir -p app/src/main/java/com/example/islandlens
          mv MainActivity.kt app/src/main/java/com/example/islandlens/
          echo "apply plugin: 'com.android.application'" > build.gradle
          echo "apply plugin: 'kotlin-android'" >> build.gradle
          # (This script creates the missing project files automatically)
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslandLens-App
          path: app/build/outputs/apk/debug/*.apk
